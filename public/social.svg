<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#faf8f1"/><ellipse cx="922" cy="461" rx="206" ry="28" fill="#ebe8d9"/><text x="65" y="85" fill="#37362f" font-family="Arial,sans-serif" font-size="30" font-weight="700">held alive.</text><text x="65" y="239" fill="#37362f" font-family="Arial,sans-serif" font-size="70" font-weight="700" letter-spacing="-3">An AI that lives</text><text x="65" y="326" fill="#54694e" font-family="Georgia,serif" font-size="74" font-style="italic" letter-spacing="-3">in our browsers.</text><text x="70" y="406" fill="#625e53" font-family="Arial,sans-serif" font-size="23">Your tab runs a small piece of its mind.</text><text x="70" y="443" fill="#625e53" font-family="Arial,sans-serif" font-size="23">When too many tabs close, browser thinking stops.</text><text x="70" y="561" fill="#4d654b" font-family="Arial,sans-serif" font-size="19">heldalive.com · an artwork by Oscar Barrera</text><g transform="translate(704 116)"><svg class="saucer-home" viewBox="0 0 600 520" aria-hidden="true" fill="none" width="480" height="416"><path d="M83 342C129 237 193 94 299 94C406 94 474 233 520 342" fill="#EDF0E7" fill-opacity=".65" stroke="#C9D3C8" stroke-width="2"></path><path d="M296 94V81H303V73H298V61H305V50" stroke="#A6B6A9" stroke-width="3" stroke-linecap="round"></path><path d="M82 331C182 391 419 391 520 331L574 383C505 468 117 470 28 384Z" fill="#DFE7DB" stroke="#ABBDAF" stroke-width="2"></path><path d="M28 384C129 457 473 461 574 383L586 398C491 496 114 493 15 399Z" fill="#B7C8BB" stroke="#8CA397" stroke-width="2"></path><path d="M83 344C197 405 410 402 520 344" stroke="#F8F9ED" stroke-width="5"></path><path d="m77 383 14 7m-10-15 14 7m35 14 17 5m-12-14 17 5m40 9 18 3m-15-13 18 3m43 5 18 1m-15-11 18 1m43 0 18-1m-15-9 18-1m42-4 18-3m-15-7 18-3m41-7 17-5m-13-5 17-5m34-11 14-7m-11-3 14-7" stroke="#718E80" stroke-width="2" stroke-linecap="round"></path><path d="M76 465C219 497 40